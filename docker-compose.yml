version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartoffice-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SERVER_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - smartoffice-network

  mongodb:
    image: mongo:latest
    container_name: smartoffice-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - smartoffice-network

  authservice:
    build:
      context: ./Server/AuthService
      dockerfile: Dockerfile
    container_name: smartoffice-authservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=${SQL_DATABASE_NAME};User Id=sa;Password=${SQL_SERVER_PASSWORD};TrustServerCertificate=True;
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpiryInMinutes=${JWT_EXPIRY_MINUTES}
      - Cors__AllowedOrigins__0=http://localhost:5173
    ports:
      - "5000:8080"
    depends_on:
      - sqlserver
    networks:
      - smartoffice-network

  resourceservice:
    build:
      context: ./Server/ResourceService
      dockerfile: Dockerfile
    container_name: smartoffice-resourceservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDB__ConnectionString=mongodb://mongodb:27017
      - MongoDB__DatabaseName=${MONGO_DATABASE_NAME}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpiryInMinutes=${JWT_EXPIRY_MINUTES}
      - Cors__AllowedOrigins__0=http://localhost:5173
    ports:
      - "5001:8080"
    depends_on:
      - mongodb
      - authservice
    networks:
      - smartoffice-network

  frontend:
    build:
      context: ./Client
      dockerfile: Dockerfile
      args:
        - VITE_AUTH_API_URL=${VITE_AUTH_API_URL}
        - VITE_RESOURCE_API_URL=${VITE_RESOURCE_API_URL}
    container_name: smartoffice-frontend
    ports:
      - "5173:80"
    depends_on:
      - authservice
      - resourceservice
    networks:
      - smartoffice-network

networks:
  smartoffice-network:
    driver: bridge

volumes:
  sqlserver_data:
  mongodb_data:
